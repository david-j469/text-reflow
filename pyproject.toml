[project]
name = "reflow"
version = "0.1.0"
description = "Normalize messy hard-wrapped text and rewrap it to a fixed width"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "david-j469", email = "ytoskffugebi@aol.com" }]
keywords = ["text", "wrap", "reflow", "paragraph", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Text Processing :: Filters",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/david-j469/text-reflow"

[project.scripts]
reflow = "reflow.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
